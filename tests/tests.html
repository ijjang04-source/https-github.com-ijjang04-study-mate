<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공부 메이트 테스트</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .pass { color: var(--good); }
    .fail { color: var(--bad); font-weight: 700; }
    #results li { margin-bottom: 4px; }
    #results pre { white-space: pre-wrap; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <main id="view" style="padding-bottom: 24px">
    <h1>테스트</h1>
    <p id="summary" class="card" role="status">실행 중…</p>
    <ul id="results"></ul>
  </main>

  <!-- index.html과 같은 순서 -->
  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/dateutil.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/data/questions.js"></script>
  <script src="../js/data/strategies.js"></script>
  <script src="../js/recommend.js"></script>
  <script src="../js/test.js"></script>
  <script src="../js/strategy-view.js"></script>
  <script src="../js/planner.js"></script>
  <script src="../js/checkin.js"></script>
  <script src="../js/feed.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/settings.js"></script>
  <!-- app.js는 SM_NO_AUTOSTART로 라우터 자동 시작을 막고 로드한다. -->
  <script>window.SM_NO_AUTOSTART = true;</script>
  <script src="../js/app.js"></script>

  <script src="assert.js"></script>

  <!-- 테스트 파일: 새 *.test.js를 만들면 여기에도 추가한다. -->
  <script src="dateutil.test.js"></script>
  <script src="ui.test.js"></script>
  <script src="store.test.js"></script>
  <script src="router.test.js"></script>
  <script src="auth.test.js"></script>
  <script src="chat.test.js"></script>
  <script src="questions.test.js"></script>
  <script src="test-flow.test.js"></script>
  <script src="score.test.js"></script>
  <script src="strategies.test.js"></script>
  <script src="recommend.test.js"></script>

  <script>
    (function () {
      'use strict';
      var list = document.getElementById('results');
      var summary = document.getElementById('summary');
      window.SMTest.runAll(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? '✓ 통과 ' : '✗ 실패 ') + r.name;
        if (!r.ok) {
          var pre = document.createElement('pre');
          pre.textContent = r.error && r.error.message;
          li.appendChild(pre);
        }
        list.appendChild(li);
      }).then(function (res) {
        summary.textContent = '통과 ' + res.passed + ' · 실패 ' + res.failed;
        summary.className = 'card ' + (res.failed ? 'fail' : 'pass');
      });
    })();
  </script>
</body>
</html>
